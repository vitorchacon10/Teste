<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir senha – SENAI Zerbini</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="pagina-login">
    <div class="card-login">
      <div class="logo-senai">SENAI Zerbini</div>
      <h2>Criar nova senha</h2>

      <div id="mensagem" class="mensagem-erro" style="display:none"></div>

      <div id="form-nova-senha">
        <div class="campo">
          <label for="senha">Nova senha</label>
          <input type="password" id="senha" autocomplete="new-password" />
        </div>
        <div class="campo">
          <label for="confirmar-senha">Confirmar nova senha</label>
          <input type="password" id="confirmar-senha" autocomplete="new-password" />
        </div>

        <button class="btn btn-vermelho btn-full" id="btn-redefinir">Redefinir senha</button>
      </div>

      <p style="text-align:center; margin-top: 14px; font-size: 0.85rem;">
        <a href="index.html">Voltar para o login</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const mensagemDiv = document.getElementById('mensagem');
    const formDiv = document.getElementById('form-nova-senha');
    const btn = document.getElementById('btn-redefinir');

    function mostrarMensagem(texto, sucesso) {
      mensagemDiv.style.background = sucesso ? '#d4edda' : '#f8d7da';
      mensagemDiv.style.color = sucesso ? '#155724' : '#721c24';
      mensagemDiv.textContent = texto;
      mensagemDiv.style.display = 'block';
    }

    if (!token) {
      formDiv.style.display = 'none';
      mostrarMensagem('Link inválido. Solicite a recuperação de senha novamente.', false);
    } else {
      btn.addEventListener('click', async function () {
        const senha = document.getElementById('senha').value;
        const confirmar = document.getElementById('confirmar-senha').value;

        if (!senha || senha.length < 6) {
          mostrarMensagem('A senha deve ter no mínimo 6 caracteres.', false);
          return;
        }
        if (senha !== confirmar) {
          mostrarMensagem('As senhas não coincidem.', false);
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Salvando...';

        try {
          const resposta = await api.post('/auth/reset-password', { token, password: senha });
          mostrarMensagem(resposta.message, true);
          formDiv.style.display = 'none';
        } catch (erro) {
          mostrarMensagem(erro.message, false);
          btn.disabled = false;
          btn.textContent = 'Redefinir senha';
        }
      });
    }
  </script>
</body>
</html>

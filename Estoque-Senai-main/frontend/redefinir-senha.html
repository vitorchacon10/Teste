<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir senha – SENAI Zerbini</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="pagina-login">
    <div class="card-login">
      <div class="logo-senai">SENAI Zerbini</div>
      <h2>Criar nova senha</h2>

      <div id="mensagem" class="mensagem-erro" style="display:none"></div>

      <div id="form-nova-senha">
        <div class="campo">
          <label for="senha">Nova senha</label>
          <input type="password" id="senha" autocomplete="new-password" />
        </div>
        <div class="campo">
          <label for="confirmar-senha">Confirmar nova senha</label>
          <input type="password" id="confirmar-senha" autocomplete="new-password" />
        </div>

        <button class="btn btn-vermelho btn-full" id="btn-redefinir">Redefinir senha</button>
      </div>

      <p style="text-align:center; margin-top: 14px; font-size: 0.85rem;">
        <a href="index.html">Voltar para o login</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/redefinir-senha.js"></script>
</body>
</html>
